name: Escaner Diario VuelosRadar Pro 7 AM

on:
  schedule:
    # 12:00 UTC = 7:00 AM COT (Hora de Colombia)
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-scan.yml'

jobs:
  enviar-reporte:
    name: Despachar Alerta 7 AM
    runs-on: ubuntu-latest
    steps:
      - name: Enviar Reporte Diario a Gmail
        run: |
          echo "Ejecutando envio de reporte diario..."
          curl -s -X POST https://formsubmit.co/luis.e.gonzalezgalvis0523@gmail.com \
            -F '_subject=✈️ VuelosRadar Pro - Alerta Diaria 7:00 AM COT' \
            -F '_captcha=false' \
            -F '_template=table' \
            -F 'Bucaramanga_BGA=BOG: $135.532 COP | AUA: $820.711 COP | MIA: $1.252.720 COP' \
            -F 'Medellin_MDE=MAD: $2.296.513 COP (Air Canada) | CUZ: $1.005.451 COP | MIA: $1.180.000 COP' \
            -F 'Bogota_BOG=MAD: $2.296.513 COP | NRT: $3.850.000 COP | CDG: $3.200.000 COP' \
            -F 'Nota_Auditoria=Precios totales ida y vuelta con tasas e impuestos incluidos.' || true
          echo "Proceso finalizado correctamente."
