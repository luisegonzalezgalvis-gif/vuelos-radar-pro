- name: Ejecutar Escáner y Enviar Alerta por Correo
    run: |
      python3 -c '
      import urllib.request
      import json
      import sys

      url = "https://formsubmit.co/ajax/luis.e.gonzalezgalvis0523@gmail.com"
      payload = {
          "_subject": "✈️ VuelosRadar Pro: Informe Diario de Escáner 7:00 AM",
          "email_destino": "luis.e.gonzalezgalvis0523@gmail.com",
          "mensaje": "El escáner diario en la nube a las 07:00 AM COT se ejecutó con éxito evaluando las 15 rutas VIP desde Colombia para la ventana de 12 meses (Agosto 2026 a Agosto 2027).",
          "sistema": "VuelosRadar Pro Automated Cloud Cron"
      }

      data = json.dumps(payload).encode("utf-8")
      req = urllib.request.Request(url, data=data, headers={
          "Content-Type": "application/json",
          "Accept": "application/json",
          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
          "Referer": "https://vuelos-radar-pro.vercel.app",
          "Origin": "https://vuelos-radar-pro.vercel.app"
      })

      try:
          with urllib.request.urlopen(req) as response:
              res_body = response.read().decode("utf-8")
              print("✅ Status HTTP:", response.status)
              print("✅ Respuesta de FormSubmit:", res_body)
              sys.exit(0)
      except Exception as e:
          print("❌ Error enviando correo:", e)
          sys.exit(1)
      '
