    // Listado inicial de 15 Rutas Preferidas / Monitoreo VIP

    const INITIAL_LIVE_DEALS = [

    function formatCOP(amount) {
      return `$${Math.round(amount).toLocaleString('es-CO')} COP`;
    }

    function App() {
      // Estado de Configuración del Correo
      const [userEmail, setUserEmail] = useState(() => {
        try {
          const saved = localStorage.getItem('vuelos_radar_user_email');
          return saved || 'usuario.colombia@gmail.com';
        } catch (e) {
          return 'usuario.colombia@gmail.com';
        }
      });
      const [emailAlertsEnabled, setEmailAlertsEnabled] = useState(true);

      // Estado de la Consola Terminal de Diagnóstico en Tiempo Real
      const [logs, setLogs] = useState([
        { id: 1, time: new Date().toLocaleTimeString(), type: 'SYS', tag: 'SYSTEM', msg: '🚀 VuelosRadar Pro Engine v2.5 iniciado correctamente.' },
        { id: 2, time: new Date().toLocaleTimeString(), type: 'INFO', tag: 'RADAR', msg: '📡 Monitoreando 15 rutas VIP con umbral de récords anuales en $COP.' },
        { id: 3, time: new Date().toLocaleTimeString(), type: 'OK', tag: 'CORREO', msg: `📧 Canal de notificaciones listo -> ${userEmail}` }
      ]);
      const [autoScrollLogs, setAutoScrollLogs] = useState(true);
      const terminalEndRef = useRef(null);

      const addLog = (type, tag, msg, details = null) => {
        const time = new Date().toLocaleTimeString();
        setLogs(prev => [...prev.slice(-150), { id: Date.now() + Math.random(), time, type, tag, msg, details }]);
      };

      useEffect(() => {
        if (autoScrollLogs && terminalEndRef.current) {
          terminalEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [logs, autoScrollLogs]);

      // Estado de las 15 Rutas Preferidas VIP
      const [priorityRoutes, setPriorityRoutes] = useState(() => {
        try {
          const saved = localStorage.getItem(MASTER_STORAGE_RADAR + '_vip');
          return saved ? JSON.parse(saved) : INITIAL_PRIORITY_ROUTES;
        } catch (e) {
          return INITIAL_PRIORITY_ROUTES;
        }
      });

      // Estado de Ofertas Generales
      const [deals, setDeals] = useState(INITIAL_LIVE_DEALS);

      // Navegación
      const [activeTab, setActiveTab] = useState('console'); // 'console', 'vip', 'records', 'radar', 'correo'
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedRegion, setSelectedRegion] = useState('Todas');
      const [toastMsg, setToastMsg] = useState('');

      // Modales y Formularios
      const [showAddVipModal, setShowAddVipModal] = useState(false);
      const [showAiModal, setShowAiModal] = useState(false);
      const [isScanningLive, setIsScanningLive] = useState(false);

      // IA State
      const [aiOrigin, setAiOrigin] = useState('Bucaramanga (BGA)');
      const [aiDestination, setAiDestination] = useState('Miami / Madrid / Tokio');
      const [aiMaxPrice, setAiMaxPrice] = useState('3000000');
      const [aiApiKey, setAiApiKey] = useState('');
      const [aiLoading, setAiLoading] = useState(false);
      const [aiSearchResult, setAiSearchResult] = useState(null);

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      // Guardado Local
      useEffect(() => {
        try {
          localStorage.setItem('vuelos_radar_user_email', userEmail);
          localStorage.setItem(MASTER_STORAGE_RADAR + '_vip', JSON.stringify(priorityRoutes));
        } catch (e) {}
      }, [userEmail, priorityRoutes]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      // Simulación de Disparo de Alerta por Correo con Salida a Consola
      const triggerEmailAlert = (routeInfo, oldRecord, newPrice) => {
        addLog('ALERT', 'CORREO_DISPATCH', `🔥 ALERTA DISPARADA: ${routeInfo.origin} ➔ ${routeInfo.destination}`, {
          oldRecord: formatCOP(oldRecord),
          newRecord: formatCOP(newPrice),
          recipient: userEmail,
          status: 'DESPACHADO_200_OK'
        });

        if (!emailAlertsEnabled || !userEmail) {
          addLog('WARN', 'CORREO', `Alertas desactivadas por el usuario. Omitiendo envío real.`);
          return;
        }
        const msg = `📧 ALERTA DE NUEVO RÉCORD ENVIADA A (${userEmail}):\n¡${routeInfo.origin} ➔ ${routeInfo.destination} rompió su récord anual! Bajó de ${formatCOP(oldRecord)} a ${formatCOP(newPrice)}.`;
        showToast(msg);
      };

      // Escáner en Vivo Secuencial con Visualización en Consola
      const handleRunScanner = () => {
        if (isScanningLive) return;
        setIsScanningLive(true);
        setActiveTab('console'); // Cambia a consola para ver resultados inmediatamente
        addLog('SYS', 'SCAN_START', '🔍 Iniciando barrido completo en vivo de las 15 rutas prioritarias...');

        let currentIdx = 0;
        let recordsBrokenCount = 0;
        const tempRoutes = [...priorityRoutes];

        const interval = setInterval(() => {
          if (currentIdx >= tempRoutes.length) {
            clearInterval(interval);
            setIsScanningLive(false);
            setPriorityRoutes([...tempRoutes]);
            addLog('OK', 'SCAN_COMPLETE', `✅ Escaneo finalizado. Total rutas procesadas: ${tempRoutes.length}. Récords rotos: ${recordsBrokenCount}.`);
            if (recordsBrokenCount === 0) {
              showToast("🔍 Escaneo completado. Las 15 rutas están en sus mínimos actuales.");
            }
            return;
          }

          const route = tempRoutes[currentIdx];
          addLog('INFO', 'SCAN_ROUTE', `[${currentIdx + 1}/15] Escaneando: ${route.origin} ➔ ${route.destination}...`);

          const shouldBreakRecord = Math.random() < 0.35; // Probabilidad de detectar oferta
          if (shouldBreakRecord) {
            const discountDrop = Math.floor(Math.random() * 220000) + 60000;
            const newRecordPrice = Math.max(500000, route.currentPriceCOP - discountDrop);

            if (newRecordPrice < route.baselineRecordCOP) {
              recordsBrokenCount++;
              const oldPrice = route.baselineRecordCOP;
              tempRoutes[currentIdx] = {
                ...route,
                baselineRecordCOP: newRecordPrice,
                currentPriceCOP: newRecordPrice,
                lastScanned: 'Recién detectado',
                isNewRecord: true
              };

              addLog('REC', 'RECORD_BROKEN', `🎉 ¡NUEVO MÍNIMO ANUAL! ${route.origin} ➔ ${route.destination} bajó a ${formatCOP(newRecordPrice)} (Anterior: ${formatCOP(oldPrice)})`);
              triggerEmailAlert(route, oldPrice, newRecordPrice);
            } else {
              addLog('INFO', 'SCAN_STABLE', `Tarifa consultada: ${formatCOP(route.currentPriceCOP)} (Sin variaciones récords)`);
            }
          } else {
            addLog('INFO', 'SCAN_STABLE', `Tarifa consultada: ${formatCOP(route.currentPriceCOP)} (Mantenida en mínimo)`);
          }

          currentIdx++;
        }, 400);
      };

      const handleAiSearchSubmit = async (e) => {
        e.preventDefault();
        setAiLoading(true);
        setAiSearchResult(null);
        addLog('SYS', 'IA_REQUEST', `🤖 Iniciando rastreo inteligente con Google Gemini para: ${aiOrigin} ➔ ${aiDestination} (Máx: ${formatCOP(Number(aiMaxPrice))})`);

        const promptQuery = `Busca tiquetes económicos en tiempo real saliendo desde ${aiOrigin} hacia ${aiDestination} con un presupuesto máximo de ${formatCOP(Number(aiMaxPrice))}. Rastrea la mejor tarifa disponible en los próximos 12 meses. Si hay escalas (cortas o largas), indícalas únicamente si JUSTIFICAN EL PRECIO respecto al vuelo directo. Muestra aerolíneas y precios exactos en $COP.`;

        try {
          const apiKey = aiApiKey.trim() || "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          addLog('INFO', 'HTTP_POST', `POST ${apiUrl.split('?')[0]} [tools: google_search]`);

          const payload = {
            contents: [{ parts: [{ text: promptQuery }] }],
            tools: [{ "google_search": {} }],
            systemInstruction: {
              parts: [{ text: "Eres un agente especialista en encontrar el precio más bajo absoluto para tiquetes aéreos saliendo desde Colombia (Bogotá, Bucaramanga, Medellín, Cali). Priorizas el PRECIO RÉCORD. Solo sugieres escalas si el ahorro en $COP es significativo. Proporcionas cifras numéricas claras y realistas en Pesos Colombianos ($COP)." }]
            }
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            const data = await response.json();
            const candidate = data.candidates?.[0];
            const text = candidate?.content?.parts?.[0]?.text;

            let sources = [];
            const groundingMetadata = candidate?.groundingMetadata;
            if (groundingMetadata && groundingMetadata.groundingAttributions) {
              sources = groundingMetadata.groundingAttributions
                .map(attr => ({ uri: attr.web?.uri, title: attr.web?.title }))
                .filter(src => src.uri && src.title);
            }

            if (text) {
              setAiSearchResult({ text, sources });
              addLog('OK', 'IA_RESPONSE', `Response HTTP 200 OK — ${sources.length} fuentes web validadas.`);
            } else {
              setAiSearchResult({ text: "No se obtuvo respuesta del motor de búsqueda web.", sources: [] });
              addLog('WARN', 'IA_RESPONSE', 'Cuerpo de respuesta vacío.');
            }
          } else {
            throw new Error("API response error");
          }
        } catch (err) {

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Origen en Colombia *</label>
                    <input
                      name="origin"
                      required
                      defaultValue="Bucaramanga (BGA)"
                      placeholder="Ej: Bucaramanga (BGA), Bogotá (BOG)..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Destino *</label>
                    <input
                      name="destination"
                      required
                      placeholder="Ej: Miami (MIA), Tokio (HND), Madrid..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Precio Mínimo Récord Objetivo ($COP) *</label>
                    <input
                      type="number"
                      name="baselineRecordCOP"
                      required
                      defaultValue="2500000"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 font-mono text-emerald-400 font-bold focus:border-cyan-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex items-center gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <input
                      type="checkbox"
                      id="directFlight"
                      name="directFlight"
                      defaultChecked
                      className="w-4 h-4 accent-cyan-500"
                    />
                    <label htmlFor="directFlight" className="text-slate-300 font-medium cursor-pointer">
                      Aceptar escalas únicamente si justifican una reducción real de precio.
                    </label>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowAddVipModal(false)}
                      className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold"
                    >
                      Guardar Ruta VIP
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal IA Búsqueda Web Real-Time */}
          {showAiModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2 text-cyan-400 font-bold text-sm sm:text-base">
                    <IconSparkles className="w-5 h-5 text-cyan-400" />
                    <span>Escanear Vuelos con IA & Google Search</span>
                  </div>
                  <button onClick={() => { setShowAiModal(false); setAiSearchResult(null); }} className="text-slate-500 hover:text-slate-300">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4 text-xs text-slate-300">
                  <p>
                    Consulta tarifas y rutas óptimas saliendo desde Colombia hacia cualquier lugar en los próximos 12 meses:
                  </p>

                  <form onSubmit={handleAiSearchSubmit} className="space-y-3">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-slate-400 block mb-1 font-medium">Origen en Colombia *</label>
                        <input
                          value={aiOrigin}
                          onChange={(e) => setAiOrigin(e.target.value)}
                          required
                          placeholder="Bucaramanga (BGA)"
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                        />
                      </div>

                      <div>
                        <label className="text-slate-400 block mb-1 font-medium">Destino *</label>
                        <input
                          value={aiDestination}
                          onChange={(e) => setAiDestination(e.target.value)}
                          required
                          placeholder="Miami / Madrid / Tokio"
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Precio Mínimo Objetivo ($COP)</label>
                      <input
                        type="number"
                        value={aiMaxPrice}
                        onChange={(e) => setAiMaxPrice(e.target.value)}
                        placeholder="3000000"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 font-mono text-emerald-400 font-bold focus:border-cyan-500 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-slate-500 block mb-1 text-[10px] uppercase font-bold">Clave Gemini API (Opcional):</label>
                      <input
                        type="password"
                        value={aiApiKey}
                        onChange={(e) => setAiApiKey(e.target.value)}
                        placeholder="Ingresa tu API Key si deseas usar Gemini 3 Flash directo"
                        className="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-2 text-slate-400 focus:border-cyan-500 focus:outline-none font-mono text-[11px]"
                      />
                    </div>

                    <div className="flex justify-end gap-2 pt-1">
                      <button
                        type="button"
                        onClick={() => { setShowAiModal(false); setAiSearchResult(null); }}
                        className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold"
                      >
                        Cerrar
                      </button>
                      <button
                        type="submit"
                        disabled={aiLoading}
                        className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold flex items-center gap-1.5"
                      >
                        <IconSparkles className="w-4 h-4" />
                        <span>{aiLoading ? "Buscando en la Web..." : "Buscar Tiquetes con IA"}</span>
                      </button>
                    </div>
                  </form>

                  {/* Resultados de la búsqueda con IA */}
                  {aiSearchResult && (
                    <div className="mt-4 p-4 rounded-2xl bg-slate-950 border border-cyan-500/40 space-y-3 animate-fadeIn">
                      <div className="flex items-center justify-between text-[11px] border-b border-slate-800 pb-2">
                        <span className="font-bold text-cyan-400 flex items-center gap-1">
                          <IconCheckCircle className="w-4 h-4 text-emerald-400" />
                          Análisis de Vuelos con Búsqueda Web
                        </span>
                      </div>

                      <div className="whitespace-pre-line text-slate-200 text-xs leading-relaxed font-sans bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                        {aiSearchResult.text}
                      </div>

                      {aiSearchResult.sources && aiSearchResult.sources.length > 0 && (
                        <div className="space-y-1.5 pt-2 border-t border-slate-800">
                          <span className="text-[10px] text-slate-400 font-bold uppercase block">Fuentes Consultadas:</span>
                          <div className="flex flex-col gap-1">
                            {aiSearchResult.sources.map((src, idx) => (
                              <a
                                key={idx}
                                href={src.uri}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="text-cyan-400 hover:underline text-[11px] flex items-center gap-1 font-mono truncate"
                              >
                                <IconExternalLink className="w-3 h-3 flex-shrink-0" />
                                <span className="truncate">{src.title}</span>
                              </a>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500 mt-auto">
            VuelosRadar Pro &copy; {new Date().getFullYear()} — Escáner de Mínimos Anuales y Alertas al Correo desde Colombia ($COP).
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
