    function extractAirportCode(str) {
      if (!str) return 'BOG';
      const match = str.match(/\(([A-Z]{3})\)/);
      if (match) return match[1];
      const cleaned = str.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      for (const [city, code] of Object.entries(CITY_IATA_MAP)) {
        if (cleaned.includes(city) || city.includes(cleaned)) {
          return code;
        }
      }
      const words = str.trim().toUpperCase().replace(/[^A-Z]/g, '');
      if (words.length === 3) return words;
      return str.trim();
    }

    // URL Certificada de Google Flights (tramo o ida/vuelta con fechas)
    function getGoogleFlightsUrl(origin, destination, date1, date2) {
      const originCode = extractAirportCode(origin);
      const destCode = extractAirportCode(destination);
      if (date1 && date2) {
        return `https://www.google.com/travel/flights?q=Flights%20to%20${encodeURIComponent(destCode)}%20from%20${encodeURIComponent(originCode)}%20on%20${date1}%20through%20${date2}`;
      }
      if (date1) {
        return `https://www.google.com/travel/flights?q=Flights%20to%20${encodeURIComponent(destCode)}%20from%20${encodeURIComponent(originCode)}%20on%20${date1}`;
      }
      return `https://www.google.com/travel/flights?q=Flights%20to%20${encodeURIComponent(destCode)}%20from%20${encodeURIComponent(originCode)}`;
    }

    // URL Certificada de Skyscanner Multi-Ciudad
    function getSkyscannerMultiCityUrl(origin, enterCity, exitCity, date1 = '2026-10-15', date2 = '2026-10-30') {

      const a = extractAirportCode(enterCity).toLowerCase();
      const b = extractAirportCode(exitCity).toLowerCase();
      const d1 = (date1 || '2026-10-15').replace(/-/g, '').slice(2);
      const d2 = (date2 || '2026-10-30').replace(/-/g, '').slice(2);
      return `https://www.skyscanner.com.co/transporte/vuelos/${o}/${a}/${d1}/${b}/${o}/${d2}/?adultsv2=1&cabinclass=economy`;
    }

    // URL Certificada de Kayak Multi-Ciudad

      return `https://www.kayak.com.co/flights/${o}-${a}/${d1}/${b}-${o}/${d2}?sort=price_a`;
    }

                    <div>
                      <label className="text-[11px] text-slate-400 font-bold block mb-1">Ciudad Entrada / Inicio (A) *</label>

                    <div>

                        type="text"

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                    <div>
                      <label className="text-[11px] text-slate-400 font-bold block mb-1">📅 Fecha Salida desde Colombia</label>

                        type="date"

                    </div>
                    <div>
                      <label className="text-[11px] text-slate-400 font-bold block mb-1">📅 Fecha Regreso hacia Colombia</label>
                      <input
                        type="date"
                        value={customDate2}
                        onChange={(e) => setCustomDate2(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
                      />

                  </div>

                  {/* TRAMOS INDIVIDUALES DIRECTOS A GOOGLE FLIGHTS */}
                  <div className="bg-slate-950/70 p-3.5 rounded-2xl border border-slate-800 space-y-2">

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">

                        href={getGoogleFlightsUrl(customColOrigin, customEnterCity, customDate1)}

                      >
                        <span>🛫 Tramo 1: {extractAirportCode(customColOrigin)} ➔ {extractAirportCode(customEnterCity)} ({customDate1})</span>

                      </a>

                      <a
                        href={getGoogleFlightsUrl(customExitCity, customColOrigin, customDate2)}

                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">

                    </span>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                      <a

                        <IconGlobe />
                        <span>Kayak Multi-Ciudad</span>
                        <IconExternalLink />

                      >
                        <IconSearch />
                        <span>Skyscanner Multi-Ciudad</span>
                        <IconExternalLink />
                      </a>

                      <a
                        href={getKiwiMultiCityUrl(customColOrigin, customEnterCity, customExitCity, customDate1, customDate2)}

                        rel="noopener noreferrer"
                        className="flex items-center justify-center gap-2 bg-purple-600 hover:bg-purple-500 text-white font-bold px-3 py-2.5 rounded-xl text-xs transition-all shadow-md active:scale-95 text-center"
                      >
                        <IconGlobe />
                        <span>Kiwi.com Low-Cost</span>
                        <IconExternalLink />
                      </a>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {openJawRoutes.map((oj) => (

                          <span className="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/30 font-bold">

                        </div>

                        <div className="pt-1">
                          <span className="text-xs text-slate-400 block">Origen: {oj.colOrigin}</span>

                          <span className="text-[10px] text-slate-400 block pt-1">

                          </span>
                        </div>

                        <div className="bg-cyan-500/10 border border-cyan-500/30 p-3 rounded-xl text-center space-y-1">

                          <span className="text-xl font-mono font-black text-cyan-400 block">{formatCOP(oj.price)}</span>

                        <p className="text-[11px] text-slate-400 italic bg-slate-900/40 p-2 rounded-lg border border-slate-800/50">

                            <span>🛫 Tramo 1 ({oj.startDate})</span>
                            <IconExternalLink />
                          </a>

                          <a

                          >
                            <span>🛬 Tramo 2 ({oj.endDate})</span>
                            <IconExternalLink />
                          </a>
                        </div>

                        <div className="grid grid-cols-2 gap-1.5">
                          <a
                            href={getKayakMultiCityUrl(oj.colOrigin, oj.enterCity, oj.exitCity, oj.startDate, oj.endDate)}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="flex items-center justify-center gap-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 font-bold py-1.5 px-2 rounded-xl text-[11px] transition-all text-center"

                            <span>Kayak Multi</span>

                          </a>

                          <a
                            href={getSkyscannerMultiCityUrl(oj.colOrigin, oj.enterCity, oj.exitCity, oj.startDate, oj.endDate)}

                            <span>Skyscanner</span>
                            <IconExternalLink />

                        </div>
                      </div>
                    </div>

                </div>

                  <p className="text-xs text-slate-400">Analiza rutas remotas evaluando visados, conectores clave (Madrid, Miami, Nueva York, Estambul, Dubái, Toronto) y aerolíneas low-cost.</p>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

                    <label className="text-xs text-slate-400 font-bold block mb-1">Origen Colombia</label>

                      value={aiOrigin}

                        type="checkbox"
                        checked={aiHasUsVisa}
                        onChange={(e) => setAiHasUsVisa(e.target.checked)}

                <div className="flex justify-end">
                  <button

                      <IconGlobe />
                      Radar de Ofertas Global (Conectores Inter-Hubs con Fechas)
                    </h2>
                    <p className="text-xs text-slate-400">Vuelos internacionales clave para armar escalas y conectar continentes.</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {deals.map(deal => (
                    <div key={deal.id} className="glass-card rounded-2xl p-4 space-y-3 flex flex-col justify-between">

                          <span className="text-xs font-mono font-bold text-cyan-300 flex items-center">

                        <div>
                          <span className="text-xs text-slate-400 block">{deal.origin}</span>

                        <div className="bg-slate-950/80 p-3 rounded-xl border border-slate-800 space-y-1">

                          <span className="text-xl font-mono font-black text-emerald-400 block">{formatCOP(deal.price)}</span>
                          <span className="text-[11px] text-slate-400 block pt-1">Aerolínea: {deal.airline}</span>
                        </div>

                        <p className="text-[11px] text-slate-400 italic bg-slate-900/40 p-2 rounded-lg border border-slate-800/50">
                          💡 {deal.notes}
                        </p>
                      </div>

                      <div className="pt-2">
                        <a
                          href={getGoogleFlightsUrl(deal.origin, deal.destination, deal.startDate, deal.endDate)}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="w-full flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 px-3 rounded-xl text-xs transition-all shadow-md"

                          <IconSearch />
                          <span>Buscar Conector en Google Flights ({deal.dates})</span>
                          <IconExternalLink />
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PESTAÑA 5: Histórico */}
            {activeTab === 'records' && (
              <div className="glass-card p-6 rounded-3xl space-y-4">
                <div>
                  <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    <IconTrendingDown />
                    Comportamiento Histórico de Precios (12 Meses)
                  </h2>
                  <p className="text-xs text-slate-400">Evolución de la tarifa mínima récord del mercado en Pesos Colombianos ($COP).</p>
                </div>

                <div className="h-72 relative">
                  <canvas ref={chartRef}></canvas>

              </div>

            {/* PESTAÑA 6: Consola Logs */}
            {activeTab === 'console' && (
              <div className="glass-card p-6 rounded-3xl space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    <IconTerminal />
                    Consola de Resultados & Auditoría Logs
                  </h2>
                  <button
                    onClick={() => setLogs([])}
                    className="text-xs text-slate-400 hover:text-rose-400 transition-colors"
                  >
                    Limpiar Consola
                  </button>
                </div>

                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 font-mono text-xs text-slate-300 h-96 overflow-y-auto space-y-1">
                  {logs.length === 0 ? (
                    <div className="text-slate-600 italic">No hay registros grabados en esta sesión.</div>
                  ) : (
                    logs.map((log, i) => <div key={i}>{log}</div>)

                </div>
              </div>
            )}

            {/* PESTAÑA 7: Correo */}
            {activeTab === 'correo' && (
              <div className="glass-card p-6 rounded-3xl space-y-4 max-w-xl mx-auto">
                <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                  <IconMail />
                  Alertas por Correo Diario (7:00 AM)
                </h2>
                <p className="text-xs text-slate-400">El informe automatizado se despacha todos los días a las 7:00 AM COT mediante GitHub Actions.</p>

                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                  <div>
                    <span className="text-xs font-bold text-slate-400 block">Correo Destino Configurado:</span>
                    <span className="text-sm font-mono text-cyan-400 block font-bold">luis.e.gonzalezgalvis0523@gmail.com</span>
                  </div>
                  <div className="flex items-center gap-2 text-xs text-emerald-400 font-bold">
                    <span>✓ ESTADO: SCRIPT DE GITHUB ACTIONS CONFIGURADO A LAS 7:00 AM COT</span>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-500">
            VuelosRadar Pro &copy; {new Date().getFullYear()} — Cazador de Tiquetes Baratos desde Colombia.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
