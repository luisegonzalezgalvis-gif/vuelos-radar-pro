                      <div key={log.id} className="terminal-line flex flex-col sm:flex-row sm:items-start gap-2 hover:bg-slate-900/40 p-1 rounded transition-colors">
                        <span className="text-slate-600 text-[10px] select-none shrink-0">{log.time}</span>
                        <span className={`text-[9px] uppercase px-2 py-0.5 rounded border ${tagClass} font-bold shrink-0`}>
                          [{log.tag}]
                        </span>
                        <span className={`flex-1 break-words text-xs ${colorClass}`}>
                          {log.msg}
                        </span>
                      </div>
                    );
                  })}
                  <div ref={terminalEndRef} />
                </div>

                <div className="flex items-center justify-between text-[10px] text-slate-500 pt-1 border-t border-slate-800/60 font-sans">
                  <span>Destino de Alerta: <strong className="text-slate-300">{userEmail}</strong></span>
                  <span className="text-emerald-400 font-mono">● LIVE_DISPATCH_READY</span>
                </div>
              </div>
            )}

            {/* Radar Global */}
            {activeTab === 'radar' && (
              <div className="space-y-5">
                <div className="glass-panel p-4 rounded-2xl border border-cyan-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h3 className="font-extrabold text-sm text-cyan-300 flex items-center gap-2">
                      <IconGlobe className="w-4 h-4 text-cyan-400" />
                      Radar de Ofertas Global — Caza de Mega Descuentos (&gt;40% a 60% OFF)
                    </h3>
                    <p className="text-xs text-slate-400 pt-0.5">
                      Rastrea ofertas relámpago espontáneas saliendo desde Colombia con valores TOTALES DE IDA Y VUELTA CON IMPUESTOS INCLUIDOS.
                    </p>
                  </div>
                  <span className="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/30 whitespace-nowrap">
                    {deals.length} Ofertas de Descuento Activas
                  </span>
                </div>

                <div className="glass-panel p-4 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div className="relative flex-1">
                    <IconSearch className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
                    <input
                      type="text"
                      placeholder="Buscar oferta por destino (Panamá, Madrid, Tokio, Dubái, Lima)..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
                    />
                  </div>

                  <div className="flex items-center gap-2 overflow-x-auto no-scrollbar">
                    {['Todas', 'Colombia', 'Asia', 'Europa', 'Medio Oriente', 'Sudamérica', 'Centroamérica', 'Norteamérica'].map(reg => (
                      <button
                        key={reg}
                        onClick={() => setSelectedRegion(reg)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap ${
                          selectedRegion === reg ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-950 text-slate-400 border border-slate-800'
                        }`}
                      >
                        {reg}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {deals
                    .filter(d => selectedRegion === 'Todas' || d.region === selectedRegion)
                    .filter(d => {
                      if (!searchQuery.trim()) return true;
                      const q = searchQuery.toLowerCase();
                      const origin = (d.origin || '').toLowerCase();
                      const dest = (d.destination || '').toLowerCase();
                      const airline = (d.airline || '').toLowerCase();
                      return origin.includes(q) || dest.includes(q) || airline.includes(q);
                    })
                    .map(deal => (
                      <div key={deal.id} className="glass-card rounded-3xl p-5 border border-slate-800 flex flex-col justify-between space-y-3">
                        <div className="space-y-2">
                          <div className="flex items-center justify-between text-[10px] font-mono">
                            <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-0.5 rounded-full font-bold uppercase">
                              -{deal.discountPct}% DCTO RÉCORD
                            </span>
                            <span className="text-cyan-400 font-bold">📅 {deal.datesFormatted}</span>
                          </div>

                          <h3 className="text-base sm:text-lg font-extrabold text-white">
                            {deal.origin} ➔ {deal.destination}
                          </h3>

                          {deal.isSeparateTickets && (
                            <div className="bg-amber-500/10 border border-amber-500/30 p-2 rounded-xl flex items-start gap-1.5 text-[10px] text-amber-300 font-sans">
                              <IconAlertTriangle className="w-4 h-4 flex-shrink-0 text-amber-400 mt-0.5" />
                              <span>{deal.separateTicketWarning || '⚠️ COMPRA POR SEPARADO: Se deben adquirir 2 tiquetes independientes en aerolíneas distintas.'}</span>
                            </div>
                          )}

                          <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 space-y-1 text-xs">
                            <p className="text-emerald-400 font-bold">✈️ Aerolínea: {deal.airline}</p>
                            <p className="text-slate-400 text-[11px]">{deal.route}</p>
                            <span className="text-[9px] text-emerald-400 font-mono font-bold block uppercase border-t border-slate-800/80 pt-1">
                              ✓ IDA Y VUELTA — IMPUESTOS Y TASAS INCLUIDAS
                            </span>
                            {deal.layoverNote && (
                              <p className="text-[10px] text-amber-300 italic pt-1 border-t border-slate-800/80">
                                💡 "{deal.layoverNote}"
                              </p>
                            )}
                          </div>
                        </div>

                        <div className="flex items-center justify-between border-t border-slate-800/80 pt-3">
                          <div>
                            <span className="text-[10px] text-slate-500 line-through block font-mono">
                              {formatCOP(deal.normalPriceCOP)}
                            </span>
                            <span className="text-base font-black text-emerald-400 font-mono">
                              {formatCOP(deal.priceCOP)}
                            </span>
                          </div>

                          <a
                            href={deal.promoUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-3.5 py-2 rounded-xl text-xs font-extrabold transition-all flex items-center gap-1.5 shadow-md shadow-cyan-500/20 active:scale-95"
                          >
                            <span>Ir a {deal.promoSource}</span>
                            <IconExternalLink className="w-3.5 h-3.5" />
                          </a>
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            )}

            {}
            {/* Pestaña Histórico */}
            {activeTab === 'records' && (
              <div className="glass-panel p-5 sm:p-6 rounded-3xl space-y-5">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                  <div>
                    <h3 className="font-bold text-base text-slate-100 flex items-center gap-2">
                      <IconTrendingDown className="w-5 h-5 text-cyan-400" />
                      Comportamiento Histórico de Precio Total (Últimos 12 Meses)
                    </h3>
                    <p className="text-xs text-slate-400">Precios totales de ida y vuelta con todos los impuestos incluidos.</p>
                  </div>

                  <div className="flex items-center gap-2">
                    <label className="text-xs text-slate-400 font-mono hidden sm:inline">Seleccionar Ruta:</label>
                    <select
                      value={selectedRouteHistoryId}
                      onChange={(e) => setSelectedRouteHistoryId(e.target.value)}
                      className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-cyan-400 focus:outline-none focus:border-cyan-500 max-w-[280px]"
                    >
                      {priorityRoutes.map(r => (
                        <option key={r.id} value={r.id}>
                          {r.origin.split(' ')[0]} ➔ {r.destination.split(' ')[0]} ({formatCOP(r.baselineRecordCOP)})
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="h-80 w-full relative pt-2">
                  <canvas ref={chartRef}></canvas>
                </div>
              </div>
            )}

            {/* Pestaña Correo */}
            {activeTab === 'correo' && (
              <div className="glass-panel p-5 sm:p-6 rounded-3xl space-y-6 max-w-2xl mx-auto">
                <div className="border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-slate-100 flex items-center gap-2">
                    <IconMail className="w-5 h-5 text-cyan-400" />
                    Configuración de Alertas Automáticas al Correo Electrónico
                  </h3>
                  <p className="text-xs text-slate-400">Recibe un correo electrónico inmediato en tu bandeja de entrada cada vez que cualquiera de tus 15 rutas preferidas rompa su récord de precio mínimo anual (Ida y vuelta con impuestos incluidos).</p>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    showToast("✅ Configuración de correo guardada correctamente.");
                  }}
                  className="space-y-4 text-xs"
                >
                  <div>
                    <label className="text-slate-300 block mb-1 font-semibold">Tu Correo Electrónico Principal *</label>
                    <input
                      type="email"
                      value={userEmail}
                      onChange={(e) => setUserEmail(e.target.value)}
                      required
                      placeholder="ejemplo@correo.com"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:border-cyan-500 focus:outline-none font-mono text-sm"
                    />
                  </div>

                  <div className="flex items-center gap-3 bg-slate-950 p-3.5 rounded-2xl border border-slate-800">
                    <input
                      type="checkbox"
                      id="emailAlertsEnabled"
                      checked={emailAlertsEnabled}
                      onChange={(e) => setEmailAlertsEnabled(e.target.checked)}
                      className="w-4 h-4 accent-cyan-500"
                    />
                    <label htmlFor="emailAlertsEnabled" className="text-slate-200 font-medium cursor-pointer">
                      Activar envío automático de correos con precios totales ida y vuelta cuando una ruta preferida rompa su récord del año.
                    </label>
                  </div>

                  <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={handleSendTestEmail}
                      disabled={isSendingTestEmail}
                      className="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold text-xs flex items-center justify-center gap-1.5 border border-slate-700"
                    >
                      <IconSend className="w-4 h-4" />
                      <span>{isSendingTestEmail ? "Enviando Correo..." : "🧪 Probar Envío Correo Real"}</span>
                    </button>

                    <button
                      type="submit"
                      className="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs"
                    >
                      Guardar Configuración
                    </button>
                  </div>
                </form>
              </div>
            )}

          </main>

          {/* Modal Agregar Ruta VIP */}
          {showAddVipModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-slate-100 text-base flex items-center gap-2">
                    <IconStar className="w-5 h-5 text-amber-400" />
                    Agregar Nueva Ruta VIP a Monitorear
                  </h3>
                  <button onClick={() => setShowAddVipModal(false)} className="text-slate-500 hover:text-slate-300">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const newRoute = {
                      id: 'vip-' + Date.now(),
                      origin: formData.get('origin'),
                      originCode: formData.get('originCode') || 'BGA',
                      destination: formData.get('destination'),
                      destCode: formData.get('destCode') || 'CUN',
                      departureDate: formData.get('departureDate') || '2026-09-15',
                      returnDate: formData.get('returnDate') || '2026-09-22',
                      baselineRecordCOP: Number(formData.get('baselineRecordCOP')) || 1894950,
                      currentPriceCOP: Number(formData.get('baselineRecordCOP')) || 1894950,
                      lastScanned: 'Recién añadida',
                      priority: true,
                      directFlight: formData.get('directFlight') === 'on',
                      airline: formData.get('airline') || 'Copa Airlines',
                      airlineNote: formData.get('airlineNote') || 'Tarifa TOTAL final de ida y vuelta con todos los impuestos incluidos.',
                      isSeparateTickets: formData.get('isSeparateTickets') === 'on',
                      alertOnBreak: true,
                      promoSource: 'Copa Airlines (Oficial)',
                      promoUrl: 'https://www.copaair.com/es-co/'
                    };

                    setPriorityRoutes([newRoute, ...priorityRoutes]);
                    setShowAddVipModal(false);
                    showToast("¡Ruta añadida con tarifa total ida y vuelta a tu lista VIP!");
                  }}
                  className="space-y-4 text-xs"
                >
                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Origen en Colombia *</label>
                    <input
                      name="origin"
                      required
                      defaultValue="Bucaramanga (BGA)"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Destino *</label>
                    <input
                      name="destination"
                      required
                      placeholder="Ej: Cancún (CUN), México..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Aerolínea Principal *</label>
                    <input
                      name="airline"
                      required
                      defaultValue="Copa Airlines / Avianca"
                      placeholder="Ej: Copa, JetSMART, Wingo, Avianca..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none font-semibold text-emerald-400"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Código Origen IATA</label>
                      <input
                        name="originCode"
                        defaultValue="BGA"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-slate-200 uppercase font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-medium">Código Destino IATA</label>
                      <input
                        name="destCode"
                        defaultValue="CUN"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-slate-200 uppercase font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-medium">Precio TOTAL Ida y Vuelta con Impuestos ($COP) *</label>
                    <input
                      type="number"
                      name="baselineRecordCOP"
                      required
                      defaultValue="1894950"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 font-mono text-emerald-400 font-bold focus:border-cyan-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowAddVipModal(false)}
                      className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold"
                    >
                      Guardar Ruta VIP
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500 mt-auto">
            VuelosRadar Pro &copy; {new Date().getFullYear()} — Escáner Directo con Tarifas Totales Ida y Vuelta Incluyendo Impuestos y Tasas.
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
