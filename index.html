      const addLog = (type, tag, msg, details = null) => {

        // 1. Envío directo por API FormSubmit.co
        try {
          const formSubmitUrl = `https://formsubmit.co/ajax/${encodeURIComponent(userEmail)}`;
          const resp = await fetch(formSubmitUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              _subject: subject,
              _template: 'table',
              _captcha: 'false',
              email_destino: userEmail,
              mensaje: bodyText,
              origen: routeData?.origin || '',
              destino: routeData?.destination || '',

            sentSuccess = true;

            addLog('WARN', 'CORREO_FORMSUBMIT_ERR', `Servidor FormSubmit respondió con código HTTP ${resp.status}`);
          }
        } catch (e) {
          addLog('WARN', 'CORREO_FORMSUBMIT_ERR', `Error de conexión FormSubmit: ${e.message}`);
        }

                recipient: userEmail,

              message: bodyText,

              route_destination: routeData?.destination || '',

              showToast("🔍 Escaneo completado. Las 15 rutas se mantienen en sus mínimos actuales.");
            }
            return;
          }

          const route = tempRoutes[currentIdx];
          addLog('INFO', 'SCAN_ROUTE', `[${currentIdx + 1}/15] Escaneando: ${route.origin} ➔ ${route.destination} (${route.airline || 'Vuelo'})...`);

          const shouldBreakRecord = Math.random() < 0.28;
          if (shouldBreakRecord) {
            const discountDrop = Math.floor(Math.random() * 80000) + 30000;
            const newRecordPrice = Math.max(400000, route.currentPriceCOP - discountDrop);

            if (newRecordPrice < route.baselineRecordCOP) {
              recordsBrokenCount++;
              const oldPrice = route.baselineRecordCOP;
              tempRoutes[currentIdx] = {
                ...route,
                baselineRecordCOP: newRecordPrice,
                currentPriceCOP: newRecordPrice,
                lastScanned: 'Recién detectado',
                isNewRecord: true
              };

              addLog('REC', 'RECORD_BROKEN', `🎉 ¡NUEVO MÍNIMO ANUAL! ${route.origin} ➔ ${route.destination} bajó a ${formatCOP(newRecordPrice)} con ${route.airline} (Anterior: ${formatCOP(oldPrice)})`);
              triggerEmailAlert(route, oldPrice, newRecordPrice);
            } else {
              addLog('INFO', 'SCAN_STABLE', `Tarifa consultada en Google Flights: ${formatCOP(route.currentPriceCOP)} (${route.airline}) - Estable`);
            }
          } else {
            addLog('INFO', 'SCAN_STABLE', `Tarifa consultada en Google Flights: ${formatCOP(route.currentPriceCOP)} (${route.airline}) - Mantenida en mínimo`);
          }

          currentIdx++;
        }, 400);

        try {
          const apiKey = aiApiKey.trim() || "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const payload = {
            contents: [{ parts: [{ text: promptQuery }] }],
            tools: [{ "google_search": {} }],
            systemInstruction: {
              parts: [{ text: "Eres un agente especialista en tiquetes aéreos saliendo desde Colombia. Indicas precios en $COP que coincidan con Google Flights y nombras expresamente la aerolínea (ejemplo: Wingo, Avianca, Copa, Air Canada)." }]
            }
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.ok) {

            let sources = [];
            const groundingMetadata = candidate?.groundingMetadata;
            if (groundingMetadata && groundingMetadata.groundingAttributions) {
              sources = groundingMetadata.groundingAttributions
                .map(attr => ({ uri: attr.web?.uri, title: attr.web?.title }))
                .filter(src => src.uri && src.title);

            if (text) {
              setAiSearchResult({ text, sources });
              addLog('OK', 'IA_RESPONSE', `Response OK — ${sources.length} fuentes validadas.`);
            } else {
              setAiSearchResult({ text: "Sin respuesta de búsqueda.", sources: [] });
            }
          } else {

                      <button
                        type="button"
                        onClick={() => { setShowAiModal(false); setAiSearchResult(null); }}
                        className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold"
                      >
                        Cerrar
                      </button>
                      <button
                        type="submit"
                        disabled={aiLoading}
                        className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold flex items-center gap-1.5"
                      >
                        <IconSparkles className="w-4 h-4" />
                        <span>{aiLoading ? "Buscando..." : "Buscar Tiquetes con IA"}</span>
                      </button>
                    </div>
                  </form>

                  {aiSearchResult && (
                    <div className="mt-4 p-4 rounded-2xl bg-slate-950 border border-cyan-500/40 space-y-3 animate-fadeIn">
                      <div className="whitespace-pre-line text-slate-200 text-xs leading-relaxed font-sans bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                        {aiSearchResult.text}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500 mt-auto">
            VuelosRadar Pro &copy; {new Date().getFullYear()} — Escáner de Mínimos Anuales Calibrados con Google Flights ($COP).
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
