    function formatCOP(amount) {
      return `$${Math.round(amount).toLocaleString('es-CO')} COP`;

    function getGoogleFlightsUrl(origin, destination, dates) {
      const originMatch = origin.match(/\(([A-Z]{3})\)/);
      const destMatch = destination.match(/\(([A-Z]{3})\)/);
      
      const originCode = originMatch ? originMatch[1] : origin.split(' ')[0];
      const destCode = destMatch ? destMatch[1] : destination.split(' ')[0];
      
      let dateQuery = '';
      if (dates && dates.includes(' al ')) {
        const [start, end] = dates.split(' al ');
        dateQuery = `+from+${start.trim()}+to+${end.trim()}`;
      }
      
      return `https://www.google.com/travel/flights?q=flights+from+${encodeURIComponent(originCode)}+to+${encodeURIComponent(destCode)}${dateQuery}`;
    }

    // --- CONSUMO GEMINI 3 FLASH CON GOOGLE SEARCH GROUNDING ---
    async function fetchGeminiGroundingBatch(routesBatch) {
      const apiKey = localStorage.getItem('vuelos_gemini_api_key') || "";
      if (!apiKey) {
        throw new Error("Falta configurar la API Key de Gemini");
      }
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const promptText = `Usa Google Search para investigar en tiempo real los precios reales vigentes de tiquetes aéreos de ida y vuelta en Pesos Colombianos (COP) con impuestos y tasas de aeropuerto incluidas para las siguientes rutas desde Colombia:

${routesBatch.map((r, idx) => `${idx + 1}. [ID: ${r.id}] ${r.origin} a ${r.destination} (Fechas vigentes: ${r.dates})`).join('\n')}

Para cada ruta, busca en Google Flights / sitios oficiales de aerolíneas la tarifa mínima real ida y vuelta en COP, las mejores fechas con ese precio y la aerolínea operadora.

Devuelve ÚNICAMENTE un arreglo JSON válido encerrado entre \`\`\`json y \`\`\` con este formato por elemento:
[
  {
    "id": "vip-1",
    "currentPrice": 135532,
    "dates": "2026-10-29 al 2026-11-01",
    "airline": "JetSMART",
    "status": "Piso Récord",
    "notes": "Detalle real de la tarifa encontrada"
  }
]`;

      const payload = {
        contents: [{ parts: [{ text: promptText }] }],
        tools: [{ "google_search": {} }],
        systemInstruction: {
          parts: [{ text: "Eres un buscador analítico de vuelos reales en Colombia. Devuelve exclusivamente un objeto JSON válido dentro de un bloque ```json ``` con las tarifas vivas encontradas en la web." }]
        }
      };

      let retries = 0;
      const maxRetries = 2;
      while (retries < maxRetries) {
        try {
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error?.message || `HTTP ${res.status}`);
          }
          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          
          const jsonMatch = text.match(/\[[\s\S]*\]/);
          if (jsonMatch) {
            return JSON.parse(jsonMatch[0]);
          }
          throw new Error("Formato JSON no encontrado en respuesta");
        } catch(e) {
          if (e.message.includes("Falta configurar")) throw e;
          retries++;
          if (retries >= maxRetries) throw e;
          await new Promise(r => setTimeout(r, 1000));
        }
      }
      return null;
    }

                        onChange={(e) => setCustomColOrigin(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
                      >
                        <option value="Bucaramanga (BGA)">Bucaramanga (BGA)</option>
                        <option value="Medellín (MDE)">Medellín (MDE)</option>
                        <option value="Bogotá (BOG)">Bogotá (BOG)</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-[11px] text-slate-400 font-bold block mb-1">Ciudad Entrada / Inicio (A) *</label>
                      <input
                        type="text"
                        placeholder="Ej: Venecia, Singapur, Praga..."
                        value={customEnterCity}
                        onChange={(e) => setCustomEnterCity(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
                      />
                    </div>

                    <div>
                      <label className="text-[11px] text-slate-400 font-bold block mb-1">Ciudad Salida / Regreso (B) *</label>
                      <input
                        type="text"
                        placeholder="Ej: Atenas, Bangkok, Budapest..."
                        value={customExitCity}
                        onChange={(e) => setCustomExitCity(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end pt-2">
                    <a
                      href={`https://www.google.com/travel/flights?q=flights+from+${encodeURIComponent(customColOrigin)}+to+${encodeURIComponent(customEnterCity)}+and+${encodeURIComponent(customExitCity)}+to+${encodeURIComponent(customColOrigin)}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="flex items-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs transition-all shadow-lg active:scale-95"
                    >
                      <span>Cotizar Ruta Creada en Google Flights</span>
                      <IconExternalLink />
                    </a>
                  </div>
                </div>

                {/* Rutas Multi-Destino Prediseñadas */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {openJawRoutes.map((oj) => (
                    <div key={oj.id} className="glass-card rounded-2xl p-5 space-y-3 flex flex-col justify-between">
                      <div className="space-y-2">
                        <span className="text-[10px] font-bold uppercase text-cyan-400 bg-cyan-500/10 px-2.5 py-0.5 rounded-full border border-cyan-500/30">
                          {oj.name}
                        </span>

                        <div className="pt-1">
                          <span className="text-xs text-slate-400 block">Origen: {oj.colOrigin}</span>
                          <div className="text-sm font-bold text-slate-100">
                            🛬 Entrada: <span className="text-emerald-400">{oj.enterCity}</span>
                          </div>
                          <div className="text-sm font-bold text-slate-100">
                            🛫 Regreso: <span className="text-amber-400">{oj.exitCity}</span>
                          </div>
                        </div>

                        <div className="bg-slate-950/80 p-3 rounded-xl border border-slate-800 space-y-1">
                          <span className="text-[10px] text-slate-400 block font-bold uppercase">Estimación Total con Impuestos:</span>
                          <span className="text-lg font-mono font-bold text-cyan-300 block">{formatCOP(oj.price)}</span>
                          <span className="text-[10px] text-slate-400 block">Fechas sugeridas: {oj.dates}</span>
                        </div>

                        <p className="text-[11px] text-slate-400 italic bg-slate-900/40 p-2 rounded-lg border border-slate-800/50">
                          💡 {oj.notes}
                        </p>
                      </div>

                      <div className="pt-2">
                        <a
                          href={`https://www.google.com/travel/flights?q=flights+from+${encodeURIComponent(oj.colOrigin)}+to+${encodeURIComponent(oj.enterCity)}+and+${encodeURIComponent(oj.exitCity)}+to+${encodeURIComponent(oj.colOrigin)}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 px-3 rounded-xl text-xs transition-all border border-slate-700"
                        >
                          <span>Buscar Open-Jaw en Google Flights</span>
                          <IconExternalLink />
                        </a>
                      </div>
                    </div>
                  ))}
                </div>

              </div>
            )}

            {/* VISTA 3: Escalas IA */}
            {activeTab === 'rutas-ia' && (
              <div className="glass-panel p-6 rounded-3xl space-y-6">
                <div>
                  <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    <IconCompass />
                    Asistente de Escalas & Hubs Conectores con IA
                  </h2>
                  <p className="text-xs text-slate-400">Analiza rutas remotas evaluando visados, conectores clave (Madrid, Miami, Nueva York, Estambul, Dubái, Toronto) y aerolíneas low-cost.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label className="text-xs text-slate-400 font-bold block mb-1">Origen Colombia</label>
                    <select
                      value={aiOrigin}
                      onChange={(e) => setAiOrigin(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-purple-500"
                    >
                      <option value="Bucaramanga (BGA)">Bucaramanga (BGA)</option>
                      <option value="Medellín (MDE)">Medellín (MDE)</option>
                      <option value="Bogotá (BOG)">Bogotá (BOG)</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 font-bold block mb-1">Destino Remoto Deseado *</label>
                    <input
                      type="text"
                      placeholder="Ej: Sri Lanka, Tokio, Bali, El Cairo, Sídney..."
                      value={aiDestination}
                      onChange={(e) => setAiDestination(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-purple-500"
                    />
                  </div>

                  <div className="flex items-center gap-3 pt-4">
                    <label className="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
                      <input
                        type="checkbox"
                        checked={aiHasUsVisa}
                        onChange={(e) => setAiHasUsVisa(e.target.checked)}
                        className="rounded accent-purple-500 w-4 h-4"
                      />
                      <span className="font-bold text-amber-300">✓ Tengo Visa de EE.UU. / Tránsito Canadá Activo</span>
                    </label>
                  </div>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={handleRunAiAssistant}
                    disabled={loadingAi || !aiDestination}
                    className="flex items-center gap-2 bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-400 hover:to-indigo-500 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition-all shadow-lg disabled:opacity-50"
                  >
                    <IconSparkles />
                    <span>{loadingAi ? 'Analizando con IA...' : 'Analizar Estrategia de Escalas con IA'}</span>
                  </button>
                </div>

                {aiResponse && (
                  <div className="bg-slate-950 p-5 rounded-2xl border border-purple-500/30 text-xs text-slate-200 space-y-3 leading-relaxed whitespace-pre-line font-mono">
                    {aiResponse}
                  </div>
                )}
              </div>
            )}

            {/* VISTA 4: Radar Global */}
            {activeTab === 'radar' && (
              <div className="space-y-4">
                <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                  <div>
                    <h2 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                      <IconGlobe />
                      Radar de Ofertas Global (Conectores Inter-Hubs)
                    </h2>
                    <p className="text-xs text-slate-400">Vuelos internacionales clave para armar escalas y conectar continentes.</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {deals.map(deal => (
                    <div key={deal.id} className="glass-card rounded-2xl p-4 space-y-3 flex flex-col justify-between">
                      <div className="space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-[10px] font-bold uppercase text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/30">
                            {deal.region}
                          </span>
                          <span className="text-xs font-mono font-bold text-slate-300">{deal.dates}</span>
                        </div>

                        <div>
                          <span className="text-xs text-slate-400 block">{deal.origin}</span>
                          <h3 className="font-extrabold text-base text-white">➔ {deal.destination}</h3>
                        </div>

                        <div className="bg-slate-950/80 p-3 rounded-xl border border-slate-800">
                          <span className="text-[10px] text-slate-400 block font-bold uppercase">Tarifa Conectora con Impuestos:</span>
                          <span className="text-xl font-mono font-black text-emerald-400 block">{formatCOP(deal.price)}</span>
                          <span className="text-[11px] text-slate-400 block pt-1">Aerolínea: {deal.airline}</span>
                        </div>

                        <p className="text-[11px] text-slate-400 italic bg-slate-900/40 p-2 rounded-lg border border-slate-800/50">
                          💡 {deal.notes}
                        </p>
                      </div>

                      <div className="pt-2 flex flex-col gap-2">
                        <a
                          href={getGoogleFlightsUrl(deal.origin, deal.destination, deal.dates)}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="w-full flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 px-3 rounded-xl text-xs transition-all shadow-md"
                        >
                          <IconSearch />
                          <span>Buscar Conector en Google Flights (Fechas Fijadas)</span>
                          <IconExternalLink />
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VISTA 5: Histórico */}
            {activeTab === 'records' && (
              <div className="glass-panel p-6 rounded-3xl space-y-4">
                <div>
                  <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    <IconTrendingDown />
                    Comportamiento Histórico de Precios (12 Meses)
                  </h2>
                  <p className="text-xs text-slate-400">Evolución de la tarifa mínima récord del mercado en Pesos Colombianos ($COP).</p>
                </div>

                <div className="h-72 relative">
                  <canvas ref={chartRef}></canvas>
                </div>
              </div>
            )}

            {/* VISTA 6: Consola Logs */}
            {activeTab === 'console' && (
              <div className="glass-panel p-6 rounded-3xl space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    <IconTerminal />
                    Consola de Resultados & Auditoría Logs
                  </h2>
                  <button
                    onClick={() => setLogs([])}
                    className="text-xs text-slate-400 hover:text-rose-400 transition-colors"
                  >
                    Limpiar Consola
                  </button>
                </div>

                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 font-mono text-xs text-slate-300 h-96 overflow-y-auto space-y-1">
                  {logs.length === 0 ? (
                    <div className="text-slate-600 italic">No hay registros grabados en esta sesión.</div>
                  ) : (
                    logs.map((log, i) => <div key={i}>{log}</div>)
                  )}
                </div>
              </div>
            )}

            {/* VISTA 7: Correo */}
            {activeTab === 'correo' && (
              <div className="glass-panel p-6 rounded-3xl space-y-4 max-w-xl mx-auto">
                <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                  <IconMail />
                  Configurar Alertas por Correo Diario (7:00 AM)
                </h2>
                <p className="text-xs text-slate-400">Las alertas automáticas se envían todos los días a las 7:00 AM COT vía GitHub Actions + FormSubmit.</p>

                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                  <span className="text-xs font-bold text-slate-300 block">Correo Destino Configurado:</span>
                  <span className="text-xs font-mono text-cyan-400 block font-bold">luis.e.gonzalezgalvis0523@gmail.com</span>
                  <span className="text-[11px] text-emerald-400 block">✓ ESTADO: ACTIVO Y VERIFICADO EN FORM SUBMIT</span>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-500">
            VuelosRadar Pro &copy; {new Date().getFullYear()} — Cazador de Tiquetes Baratos desde Colombia.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
